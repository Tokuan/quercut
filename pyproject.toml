[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quercut"
version = "0.2.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]          # ищет пакеты в текущей директории
include = ["quercut*"] # включаем только quercut